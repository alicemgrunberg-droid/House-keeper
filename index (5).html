/* Typographie et rythme */
main{gap:20px}
.card{padding:18px;border-radius:18px}
h3{letter-spacing:.07em}
.stat b{font-size:26px}
.banner:not(.has-photo)::before{content:"";position:absolute;right:-34px;top:-44px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--accent) 24%,transparent)}
.banner:not(.has-photo)::after{content:"";position:absolute;right:76px;bottom:-56px;width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--strong) 12%,transparent)}
.banner .glyph{width:92px;height:92px;opacity:.4;z-index:1}
.banner .txt,.pbtns{z-index:2}
.item{transition:transform .15s,opacity .2s}
.item.done{opacity:.72}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.th-ei{display:block;font-size:26px;line-height:1.3}
/* Pastilles et icônes colorées */
.th-av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font:700 12px var(--body);background:hsl(var(--h) 60% 88%);color:hsl(var(--h) 50% 28%);flex:none;vertical-align:middle;margin-right:2px}
.th-ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:hsl(var(--h) 60% 90%);color:hsl(var(--h) 46% 32%);flex:none}
.th-ic svg{width:22px;height:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .th-av{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 65% 80%)}:root:not([data-theme="light"]) .th-ic{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 78%)}}
:root[data-theme="dark"] .th-av{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 65% 80%)}
:root[data-theme="dark"] .th-ic{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 78%)}
/* Accueil vivant */
.th-hero{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.th-eye{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.th-hi{font:600 27px/1.2 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.th-sum{color:var(--ink);font-size:15px}
.th-bday{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:8px 12px;font-weight:600;margin-top:6px}
.th-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.th-conf i{position:absolute;top:-12px;font-style:normal;font-size:16px;opacity:.9}
.th-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th-tile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;text-align:left;cursor:pointer;color:var(--ink);font:600 14px var(--body);min-width:0}
.th-tile:hover{background:var(--surface2)}
.th-tile span.n{display:block;min-width:0;overflow-wrap:anywhere}
.th-tile small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
/* Graphique dépenses */
.th-bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:6px}
.th-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.th-col b{color:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
.th-stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 3px 3px;overflow:hidden;min-height:2px}
.th-stack i{display:block}
.th-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.th-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* Apparence (réglages) */
.th-sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid var(--line)}

.wmode .bar,.wmode .bnav{display:none}.wmode main{padding-block:14px 24px}

 .bnav button{border:0;background:transparent;color:var(--ink2);font:600 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;cursor:pointer;min-width:0}
 .bnav button svg{width:24px;height:24px}

}

const num=v=>+String(v??'').replace(',','.')||0;
function agg(ses,cost){
 const W={},M={};
 ses.forEach(s=>{const d=parse(s.d);if(!d)return;const h=num(s.h),c=cost(s),w=iso(startWeek(d)),m=s.d.slice(0,7);
  (W[w]=W[w]||{h:0,c:0}).h+=h;W[w].c+=c;(M[m]=M[m]||{h:0,c:0}).h+=h;M[m].c+=c});
 return {W,M}}
function sesRows(path,ses,cost,sitter){

  return `<div class="item" style="flex-wrap:wrap"><input type="date" data-b="${path}.${i}.d" data-r="1" value="${esc(s.d)}" aria-label="Date">
  <input type="text" inputmode="decimal" data-b="${path}.${i}.h" value="${esc(s.h)}" placeholder="Heures" style="width:84px" aria-label="Heures">
  ${sitter?`<input type="text" inputmode="decimal" data-b="${path}.${i}.rate" value="${esc(s.rate)}" placeholder="€/h" style="width:76px" aria-label="Tarif horaire"><input class="gi" style="flex:1 1 110px" data-b="${path}.${i}.who" value="${esc(s.who)}" placeholder="Qui ?">${s.src==='custom'?`<span class="pill warn">Tarif modifié</span><button class="btn sm ghost" data-a="resetRate" data-p="${path}.${i}">Reprendre le taux habituel</button>`:'<span class="pill">Taux habituel</span>'}`:''}
  <input class="gi" style="flex:1 1 120px" data-b="${path}.${i}.note" value="${esc(s.note)}" placeholder="Note">
  <b style="min-width:70px;text-align:right">${eur(cost(s))}</b>${delBtn(`${path}.${i}`)}</div>`}).join('')}

function stkFrais(){

 const soon=all.filter(i=>i.exp&&sDiff(i.exp)>=0&&sDiff(i.exp)<=2).length,exp=all.filter(i=>i.exp&&sDiff(i.exp)<0).length;

 const cats=SK().cfg.cats.filter(c=>!c.dur),urgent=all.filter(i=>i.exp&&sDiff(i.exp)<=3);
 return `<div class="grid sm"><div class="stat"><b>${all.length}</b><span>produits en stock</span></div><div class="stat"><b style="color:var(--warn)">${soon}</b><span>à finir sous 2 jours</span></div><div class="stat"><b style="color:var(--crit)">${exp}</b><span>date dépassée</span></div></div>
 ${urgent.length?`<section class="card"><div class="row sb"><h3>À finir en priorité</h3>${K.sample?'<button class="btn pri sm" data-a="st-recipe">Idées de recettes</button>':''}</div>
  ${urgent.sort(stkByExp).slice(0,5).map(i=>`<div class="row sb"><span>${esc(i.name)} <span class="muted">${stkQtyText(i)}</span></span>${stkBadge(i)}</div>`).join('')}${urgent.length>5?`<div class="muted">et ${urgent.length-5} autre(s)</div>`:''}</section>`:''}
 <div class="chips">${chips}</div>
 <div class="row"><input id="stq" type="search" placeholder="Rechercher un produit" value="${esc(K.q)}" style="flex:1 1 180px" aria-label="Rechercher">
  <select id="stcat" aria-label="Catégorie"><option value="all">Toutes les catégories</option>${cats.map(c=>`<option value="${esc(c.id)}"${K.cat===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div id="stlist">${stkListHtml()}</div>`}
function stkListHtml(){
 let items=SK().items.filter(i=>!isDur(i));const q=normT(K.q);
 if(K.loc!=='all')items=items.filter(i=>i.loc===K.loc);
 if(K.cat!=='all')items=items.filter(i=>i.cat===K.cat);
 if(q)items=items.filter(i=>normT(i.name).includes(q));
 if(!SK().items.length)return`<section class="card" style="align-items:center;text-align:center"><h2>Votre stock est vide</h2><div class="muted">Photographiez un ticket de caisse ou un produit, ou ajoutez à la main. Chaque produit a un lieu (frigo, congélo, placard…) et une date.</div><div class="row"><button class="btn pri" data-a="st-tab" data-v="ajout">Ajouter des produits</button></div></section>`;
 if(!items.length)return'<div class="empty">Aucun produit ne correspond à ces filtres.</div>';
 const locs=K.loc==='all'?SK().cfg.locs:SK().cfg.locs.filter(l=>l.id===K.loc);
 const known=new Set(SK().cfg.locs.map(l=>l.id));

 const orphan=items.filter(i=>!known.has(i.loc));if(orphan.length&&K.loc==='all')groups.push([{name:'Sans lieu',color:'gris'},orphan]);
 return groups.filter(g=>g[1].length).map(([l,g])=>`<div class="stk-grp lc-${l.color||'gris'}"><h3><span class="stk-dot"></span>${esc(l.name)} · ${g.length}</h3>${g.sort(stkByExp).map(i=>stkCard(i)).join('')}</div>`).join('')}

function stkCong(){
 const locs=SK().cfg.locs.filter(l=>l.k==='cg');
 if(!locs.length)return'<section class="card"><div class="muted">Aucun lieu de type congélateur. Ajoutez-en un dans « Réglages ».</div></section>';
 const sel=K.cong==='all'?locs:locs.filter(l=>l.id===K.cong);
 const chips=`<button class="chip" aria-pressed="${K.cong==='all'}" data-a="st-cloc" data-v="all">Tous</button>`+locs.map(l=>`<button class="chip ${lcls(l.id)}" aria-pressed="${K.cong===l.id}" data-a="st-cloc" data-v="${esc(l.id)}"><span class="stk-dot"></span>${esc(l.name)} · ${SK().items.filter(i=>i.loc===l.id).length}</button>`).join('');
 const block=l=>{
  const its=SK().items.filter(i=>i.loc===l.id),dr=l.drawers||[];
  const known=new Set(dr);const other=its.filter(i=>!i.drawer||!known.has(i.drawer));

 return `<div class="muted">Les produits les plus anciens sont en haut de chaque tiroir : à utiliser en premier.</div><div class="chips">${chips}</div>${sel.map(block).join('')}`}

/* --- Menu de la semaine --- */
const MEAL_SLOTS=[['midi','Midi'],['soir','Soir']];
function stkMeal(d,s){return SK().menu.meals.find(m=>m.d===d&&m.s===s)}
function stkIngList(m){return String((m&&m.ing)||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
function stkHave(ing){const n=normT(ing);if(n.length<3)return true;return SK().items.some(i=>(+i.qty||0)>0&&(normT(i.name).includes(n)||n.includes(normT(i.name))&&normT(i.name).length>=3))}
function stkMissing(m){return stkIngList(m).filter(x=>!stkHave(x))}
function stkMissHtml(m){const miss=stkMissing(m),tot=stkIngList(m).length;if(!tot)return'';return miss.length?`<div class="chips">${miss.map(x=>`<span class="pill crit">Manque : ${esc(x)}</span>`).join('')}</div>`:'<div class="chips"><span class="pill ok">Tout est en stock</span></div>'}
function stkWeekMissing(days){const out=[];days.forEach(d=>MEAL_SLOTS.forEach(([s])=>{stkMissing(stkMeal(iso(d),s)).forEach(x=>{if(!out.some(o=>normT(o)===normT(x)))out.push(x)})}));return out}
function stkMenu(){
 const ws=startWeek(addDays(todayD(),K.mw*7)),days=[...Array(7)].map((_,i)=>addDays(ws,i)),td=sToday();
 const miss=stkWeekMissing(days);
 const lab=`Semaine ${isoWeek(ws)} · ${ws.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} au ${addDays(ws,6).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;
 return `<div class="row sb"><div class="row"><button class="btn" data-a="st-mw" data-v="-1" aria-label="Semaine précédente">‹</button><b>${esc(lab)}</b><button class="btn" data-a="st-mw" data-v="1" aria-label="Semaine suivante">›</button>${K.mw!==0?'<button class="btn sm" data-a="st-mw" data-v="0">Cette semaine</button>':''}</div>
  <div class="row">${K.sample?'<button class="btn sm" data-a="st-menuideas">Idées de menu</button>':''}<button class="btn pri sm" id="mn-add" data-a="st-menumiss" ${miss.length?'':'disabled'}>Ajouter les manquants aux courses (${miss.length})</button></div></div>
 <div class="muted">Notez vos repas et leurs ingrédients, séparés par des virgules. Les ingrédients absents du stock sont signalés.</div>
 <div class="grid days">${days.map(d=>{const k=iso(d);return `<div class="day${k===td?' today':''}"><h4>${esc(fmtDay(d))}</h4>
  ${MEAL_SLOTS.map(([s,l])=>{const m=stkMeal(k,s)||{};return `<label>${l}</label><input data-mn="t" data-d="${k}" data-s="${s}" value="${esc(m.t||'')}" placeholder="Repas" aria-label="${l} du ${esc(fmtDay(d))}">
   <input data-mn="ing" data-d="${k}" data-s="${s}" value="${esc(m.ing||'')}" placeholder="Ingrédients" aria-label="Ingrédients, ${l}" style="font-size:12px"><div id="mm-${k}-${s}">${stkMissHtml(m)}</div>`}).join('')}</div>`}).join('')}</div>`}
async function stkMenuIdeas(){
 const mi=K.mi;if(!K.sample)return;
 const ws=startWeek(addDays(todayD(),K.mw*7)),slots=[];
 for(let i=0;i<7;i++){const d=iso(addDays(ws,i));if(d<sToday())continue;MEAL_SLOTS.forEach(([s])=>{if(!(stkMeal(d,s)||{}).t)slots.push({d,s})})}
 if(!slots.length){mi.err='Tous les repas de la semaine sont déjà remplis.';mi.rows=[];stkSheet(true);return}
 mi.busy=true;mi.err='';mi.rows=[];stkSheet(true);
 const urgent=stkUrgentItems().map(i=>i.name).join(', ')||'aucun',stock=SK().items.filter(i=>!isDur(i)&&(+i.qty||0)>0).slice(0,80).map(i=>i.name).join(', ')||'rien';
 try{
  const res=await K.sample.json(`Tu composes un menu pour un foyer français. Date du jour : ${sToday()}.
Produits à finir en priorité : ${urgent}.
Stock disponible : ${stock}.
Repas à remplir (un objet par repas) : ${JSON.stringify(slots.slice(0,14))}.
Réponds uniquement par un tableau JSON : [{"d":"AAAA-MM-JJ","s":"midi ou soir","t":"nom du repas","ing":"ingrédients principaux séparés par des virgules"}]. Utilise d'abord les produits à finir, puis le stock, et complète avec des ingrédients courants. Repas simples, variés, équilibrés. Un élément par repas demandé, pas plus.`,{cache:false});
  const ok=new Set(slots.map(x=>x.d+'|'+x.s));
  mi.rows=(Array.isArray(res)?res:[]).filter(r=>r&&r.t&&ok.has(r.d+'|'+r.s)).map(r=>({on:true,d:r.d,s:r.s,t:String(r.t).slice(0,80),ing:Array.isArray(r.ing)?r.ing.join(', '):String(r.ing||'').slice(0,200)}));
  if(!mi.rows.length)mi.err='Aucune idée exploitable. Réessayez.'}
 catch(e){mi.err=e&&e.code==='not_granted'?'Autorisation refusée : Claude ne peut pas proposer de menu.':e&&e.code==='rate_limited'?'Trop de demandes. Réessayez dans un moment.':'Impossible de proposer un menu pour le moment.'}
 mi.busy=false;stkSheet(true)}

/* --- Bilan, conservation, réglages --- */
function stkInPeriod(e){return K.period===0||(Date.now()-new Date(e.ts).getTime())<=K.period*864e5}
function stkBilan(){
 const pb=[[7,'7 jours'],[30,'30 jours'],[90,'3 mois'],[0,'Tout']].map(([v,l])=>`<button class="chip" aria-pressed="${K.period===v}" data-a="st-period" data-v="${v}">${l}</button>`).join('');
 const L=SLOG().filter(stkInPeriod),head=`<div class="chips">${pb}</div>`;
 if(!L.length)return head+'<section class="card"><div class="muted">Pas encore de sorties enregistrées. Chaque fois que vous utilisez « Sortir » sur une denrée, le bilan se remplit.</div></section>';
 const cons=L.filter(e=>e.action==='consomme'||e.action==='cuisine'),jet=L.filter(e=>e.action==='jete'),don=L.filter(e=>e.action==='donne'),tot=cons.length+jet.length+don.length;
 const eurs=jet.reduce((a,e)=>a+(+e.value||0),0),rate=tot?Math.round(jet.length/tot*100):0;
 const agg=(arr,key)=>{const m={};arr.forEach(e=>{const k=key(e)||'Autre';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const bars=rows=>{if(!rows.length)return'<div class="muted">Rien de jeté sur la période.</div>';const mx=rows[0][1];return rows.slice(0,6).map(([k,v])=>`<div class="stk-bar"><span>${esc(k)}</span><span class="t"><i style="width:${Math.max(4,v/mx*100)}%"></i></span><b>${v}</b></div>`).join('')};
 const names={};jet.forEach(e=>{names[e.name]=(names[e.name]||0)+1});const top=Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return head+`<div class="grid sm"><div class="stat"><b>${cons.length}</b><span>consommés</span></div><div class="stat"><b style="color:var(--crit)">${jet.length}</b><span>jetés (${rate} %)</span></div><div class="stat"><b>${don.length}</b><span>donnés</span></div><div class="stat"><b style="color:var(--crit)">${eur(eurs)}</b><span>jetés (prix saisis)</span></div></div>
 <div class="grid"><section class="card"><h3>Pourquoi on jette</h3>${bars(agg(jet,e=>e.reason))}</section>
 <section class="card"><h3>Où on jette</h3>${bars(agg(jet,e=>locBy(e.loc).name))}</section>
 <section class="card"><h3>Quelles catégories</h3>${bars(agg(jet,e=>catBy(e.cat).name))}</section>
 ${top.length?`<section class="card"><h3>Produits les plus jetés</h3>${bars(top)}</section>`:''}</div>
 <section class="card"><h3>Dernières sorties</h3>${L.slice(0,12).map(e=>`<div class="row sb"><span>${esc(e.name)} · ${esc(({consomme:'consommé',jete:'jeté'+(e.reason?' ('+e.reason+')':''),donne:'donné',cuisine:'cuisiné'})[e.action]||'')}${e.by?' · '+esc(pname(e.by)):''}</span><span class="muted">${esc(fmtShort(e.ts.slice(0,10)))}</span></div>`).join('')}</section>`}

/* ===== Sorties, décongélation ===== */
function stkOutCore(it,q,kind,reason){
 const have=+it.qty||0;if(!(q>0)||q>have)q=have;
 const before=clone(it),left=Math.round((have-q)*1000)/1000,pu=nnum(it.pu)||0;
 const entry={id:'l'+uid(),ts:new Date().toISOString(),name:it.name,cat:it.cat,loc:it.loc,qty:q,unit:it.unit,action:kind,reason:reason||'',value:Math.round(pu*q*100)/100,homemade:!!it.homemade,by:K.me||''};
 const items=SK().items;
 if(left<=0.0001)items.splice(items.findIndex(x=>x.id===it.id),1);else it.qty=left;
 save('stock');stkLog(entry);if(kind==='jete')stkAct('a jeté '+it.name);
 const msg={consomme:'Marqué comme consommé',jete:'Marqué comme jeté',donne:'Marqué comme donné',cuisine:'Marqué comme cuisiné'}[kind];
 toast(msg,()=>{const a=SK().items,i=a.findIndex(x=>x.id===before.id);if(i>=0)a[i]=before;else a.push(before);const l=SLOG(),j=l.findIndex(x=>x.id===entry.id);if(j>=0)l.splice(j,1);save('stock');save('stocklog');render()});
 return entry}
function stkDoOut(kind,reason){
 if(!stkWrite())return;
 const sh=K.sheet,it=SK().items.find(x=>x.id===sh.id);if(!it)return;
 let q=nnum(document.getElementById('ss-qty').value);
 const u=document.getElementById('ss-u');if(u&&u.value==='p'&&nnum(it.per)>0)q=q/nnum(it.per);
 K.sheet=null;stkOutCore(it,q,kind,reason);
 if(kind==='cuisine'){K.form=stkBlankForm({homemade:true,guide:'plat_maison',cat:'pp',unit:'portion(s)',qty:'2',loc:'frigo'});stkAutoExp();K.mode='maison';K.tab='ajout'}
 render()}
function stkQuick(kind,id){
 const it=SK().items.find(x=>x.id===id);if(!it)return;
 const reason=kind==='jete'?((it.exp&&sDiff(it.exp)<0)?'Date dépassée':'Autre'):'';
 stkOutCore(it,+it.qty||0,kind,reason);render()}
function stkThawCore(it,q,locId){
 const have=+it.qty||0;if(!(q>0)||q>have)q=have;
 const snap=clone(SK().items),d=stkThawDays(it),loc=SK().cfg.locs.find(l=>l.id===locId)||SK().cfg.locs.find(l=>l.k==='fr')||SK().cfg.locs[0];
 let tgt;
 if(q>=have-0.0001)tgt=it;else{it.qty=Math.round((have-q)*1000)/1000;tgt=Object.assign(clone(it),{id:uid(),qty:q});SK().items.push(tgt)}
 Object.assign(tgt,{loc:loc.id,drawer:'',thawed:true,thawAt:sToday(),exp:sAdd(sToday(),d),since:sToday(),qty:q});
 save('stock');stkAct('a mis '+it.name+' à décongeler');stkMarkRecent([tgt.id]);
 toast(it.name+' décongelé : à consommer avant le '+sFmt(tgt.exp)+', sans recongeler',()=>{SK().items=snap;save('stock');render()});return tgt}
function stkAdjust(id,d){
 if(!stkWrite())return;
 const it=SK().items.find(x=>x.id===id);if(!it)return;
 const before=+it.qty||0;it.qty=Math.max(0,Math.round((before+d)*100)/100);save('stock');
 let extra='';if(d<0)extra=stkAfterDrop(it);
 render();if(extra)toast(it.name+' : '+nf(it.qty)+' '+it.unit+extra)}

async function stkShrink(file){
 try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85))}catch(e){return file}}
async function stkEans(files){
 if(!('BarcodeDetector' in window))return[];
 try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}),out=new Set();
  for(const f of files){const bmp=await createImageBitmap(f);(await det.detect(bmp)).forEach(x=>out.add(String(x.rawValue)))}return[...out]}catch(e){return[]}}
function stkRowFrom(r){
 const cats=SK().cfg.cats,locs=SK().cfg.locs;
 const cat=cats.some(c=>c.id===r.cat)?r.cat:firstCat(false).id,dur=!!catBy(cat).dur;
 const pref=SK().prefs[normT(r.name)];
 let loc=locs.some(l=>l.id===r.loc)?r.loc:(dur?(locs.find(l=>l.id==='cellier')||locs[0]).id:(locs.find(l=>l.id==='frigo')||locs[0]).id);
 if(pref&&locs.some(l=>l.id===pref.loc))loc=pref.loc;
 const unit=String(r.unit||'unité(s)').slice(0,20);
 let exp='',est=false;
 if(!dur){if(/^\d{4}-\d{2}-\d{2}$/.test(r.dlc||''))exp=r.dlc;else if(Number(r.days)>0){exp=sAdd(sToday(),Math.min(Math.round(Number(r.days)),1100));est=true}}
 return{on:true,name:String(r.name||'').slice(0,80),qty:String(Number(r.qty)>0?Number(r.qty):1).replace('.',','),unit,cat,loc,drawer:(pref&&pref.loc===loc&&pref.drawer)||'',exp,est,price:r.price==null||r.price===''?'':Number(r.price),
  min:r.min!=null?String(r.min):(dur?'1':''),target:r.target!=null?String(r.target):'',ean:r.ean?String(r.ean):''}}

${eans.length?'Codes-barres déjà lus par l\'appareil : '+eans.join(', ')+'.\n':''}Réponds uniquement par un objet JSON de cette forme :
{"store": nom du magasin ou null, "date": date du ticket AAAA-MM-JJ ou null, "total": total payé en euros (nombre) ou null,
 "items": [ {"name": nom clair en français (développe les abréviations, sans marque inutile),

  "price": prix total de la ligne en euros ou null,
  "dlc": date limite imprimée AAAA-MM-JJ si lisible, sinon null (toujours null pour un produit de la maison),
  "days": si dlc est null et que c'est une denrée, nombre de jours de conservation habituels depuis aujourd'hui pour ce produit non ouvert à cet endroit, sinon null,
  "ean": code-barres si lisible, sinon null} ]}
Inclus les denrées ET les produits de la maison (papier toilette, lessive, sacs poubelle, couches, gels douche, etc.). Ignore les sacs de caisse, consignes, remises et totaux. Un produit par ligne de ticket. Si rien d'utilisable n'est visible, réponds {"items": []}.`;

function ocrParse(text){
 const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const out={store:'',date:null,total:null,items:[]};
 const chain=/carrefour|leclerc|auchan|lidl|aldi|intermarch[eé]|monoprix|casino|franprix|picard|biocoop|super ?u|u express|syst[eè]me u|\bcora\b|grand frais|naturalia|thiriet|netto|vival/i;
 for(const l of lines.slice(0,8)){const m=l.match(chain);if(m){out.store=m[0].replace(/\b\w/g,c=>c.toUpperCase());break}}
 for(const l of lines){

async function bkExport(){
 const name='carnet-foyer-'+iso(todayD())+'.json';
 let json='';
 try{json=JSON.stringify(bkPayload())}catch(e){toast('Export impossible : données illisibles.');return}
 try{
  if(navigator.share&&navigator.canShare&&window.matchMedia('(display-mode: standalone)').matches){
   const fs=[new File([json],name,{type:'application/json'}),new File([json],name,{type:'text/plain'})].find(f=>navigator.canShare({files:[f]}));
   if(fs){try{await navigator.share({files:[fs],title:'Sauvegarde du carnet'});bkMarkDone();render();toast('Sauvegarde exportée : rangez le fichier dans un dossier privé.');return}catch(e){if(e&&e.name==='AbortError')return}}}
 }catch(e){}
 let dl=null;
 try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(e){dl=null}
 if(dl){
  try{await dl.save({filename:name,data:json});bkMarkDone();render();toast('Sauvegarde exportée : rangez le fichier dans un dossier privé.')}
  catch(e){if(e&&e.code==='declined')return;toast('Le téléchargement n’a pas pu démarrer. Réessayez.')}
  return}
 try{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  bkMarkDone();render();toast('Sauvegarde exportée : rangez le fichier dans un dossier privé.')}
 catch(e){toast('Le téléchargement n’a pas pu démarrer. Réessayez.')}}

function bkRestore(){

 const snap={s:Object.fromEntries(KEYS.map(k=>[k,JSON.stringify(state[k])])),p:JSON.stringify(photos),sp:JSON.stringify(K.pics||{})};
 KEYS.forEach(k=>{if(j.data[k]){state[k]=migrate(k,JSON.parse(JSON.stringify(j.data[k])));fresh[k]=false;save(k)}});
 if(j.photos&&typeof j.photos==='object')Object.keys(j.photos).forEach(k=>{const s=j.photos[k];if(PHOTO_KEYS.includes(k)&&typeof s==='string'&&s.startsWith('data:image/')){photos[k]=s;savePhoto(k)}});
 if(j.stockPhotos&&typeof j.stockPhotos==='object')Object.keys(j.stockPhotos).forEach(id=>{const s=j.stockPhotos[id];if(typeof s==='string'&&s.startsWith('data:image/'))stkSetPic(id,s)});
 BK.pending=null;render();
 toast('Sauvegarde restaurée',()=>{
  KEYS.forEach(k=>{state[k]=JSON.parse(snap.s[k]);save(k)});
  const oldP=JSON.parse(snap.p),keys=new Set([...Object.keys(photos),...Object.keys(oldP)]);photos=oldP;keys.forEach(k=>savePhoto(k));
  const oldS=JSON.parse(snap.sp);Object.keys(K.pics||{}).forEach(id=>{if(!(id in oldS))stkSetPic(id,null)});Object.entries(oldS).forEach(([id,s])=>stkSetPic(id,s));
  render()})}

function sbMakeDb(){
 const vals=new Map(),known=new Map(),ds=new Map(),cs=new Map();
 let ready=false,failed=false,busy=false,again=false,rt=null,pt=null;
 const docSnap=k=>({id:k.split('/').pop(),exists:vals.has(k),metadata:{hasPendingWrites:false,fromCache:false},data:()=>vals.get(k)});
 const colSnap=p=>({docs:[...vals.keys()].filter(k=>k.startsWith(p+'/')).map(k=>({id:k.slice(p.length+1),data:()=>vals.get(k)}))});
 const call=(f,a)=>{try{f(a)}catch(e){console.error(e)}};
 const nDoc=k=>(ds.get(k)||[]).forEach(l=>call(l.ok,docSnap(k)));
 const nCol=k=>cs.forEach((ls,p)=>{if(k.startsWith(p+'/'))ls.forEach(l=>call(l.ok,colSnap(p)))});
 const nAll=()=>{ds.forEach((ls,k)=>ls.forEach(l=>call(l.ok,docSnap(k))));cs.forEach((ls,p)=>ls.forEach(l=>call(l.ok,colSnap(p))))};
 const nErr=()=>{ds.forEach(ls=>ls.forEach(l=>l.err&&call(l.err,{code:'network'})));cs.forEach(ls=>ls.forEach(l=>l.err&&call(l.err,{code:'network'})))};
 async function poll(){
  if(busy){again=true;return}
  busy=true;
  try{
   const L=await sb.from('kv').select('key,updated_at');
   if(L.error)throw L.error;
   const rows=L.data||[],seen=new Set(),chg=[];
   rows.forEach(r=>{seen.add(r.key);if(known.get(r.key)!==r.updated_at||!vals.has(r.key))chg.push(r)});
   const gone=[...known.keys()].filter(k=>!seen.has(k));
   for(let i=0;i<chg.length;i+=20){
    const part=chg.slice(i,i+20).map(r=>r.key);
    const V=await sb.from('kv').select('key,value,updated_at').in('key',part);
    if(V.error)throw V.error;
    (V.data||[]).forEach(r=>{vals.set(r.key,r.value);known.set(r.key,r.updated_at)})}
   gone.forEach(k=>{vals.delete(k);known.delete(k)});
   if(!ready){ready=true;nAll()}
   else{chg.forEach(r=>{nDoc(r.key);nCol(r.key)});gone.forEach(k=>{nDoc(k);nCol(k)})}
   if(failed){failed=false;setSync(ro?'ro':'ok')}}
  catch(e){console.error(e);if(!failed){failed=true;nErr()}}
  finally{busy=false;if(again){again=false;setTimeout(poll,50)}}}
 const kick=()=>{clearTimeout(rt);rt=setTimeout(poll,150)};
 try{sb.channel('kv-changes').on('postgres_changes',{event:'*',schema:'public',table:'kv'},kick).subscribe()}catch(e){console.error(e)}
 pt=setInterval(poll,20000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
 window.addEventListener('online',poll);
 const add=(m,k,ok,err)=>{const e={ok,err};(m.get(k)||m.set(k,[]).get(k)).push(e);return()=>{const a=m.get(k)||[],i=a.indexOf(e);if(i>=0)a.splice(i,1)}};
 poll();
 return{
  doc:k=>({
   onSnapshot:(ok,err)=>{const u=add(ds,k,ok,err);if(ready)Promise.resolve().then(()=>call(ok,docSnap(k)));return u},
   get:async()=>docSnap(k),
   set:async v=>{
    const r=await sb.from('kv').upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'key'}).select('updated_at');
    if(r.error){const e=new Error(r.error.message||'erreur');e.code=(r.error.code==='42501'||r.status===403)?'invalid_argument':(/quota|size|too large/i.test(r.error.message||'')?'quota_exceeded':'write');throw e}
    vals.set(k,v);if(r.data&&r.data[0])known.set(k,r.data[0].updated_at)},
   delete:async()=>{
    const r=await sb.from('kv').delete().eq('key',k);
    if(r.error){const e=new Error(r.error.message||'erreur');e.code='write';throw e}
    vals.delete(k);known.delete(k)}}),
  collection:p=>({onSnapshot:(ok,err)=>{const u=add(cs,p,ok,err);if(ready)Promise.resolve().then(()=>call(ok,colSnap(p)));return u}})}}
